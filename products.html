<!DOCTYPE html>
<html lang="en">
<head>
    <title>Gamer Playground - Products</title>
    <link rel="stylesheet" href="style.css">
    <script src="javascript/script.js" defer></script>
</head>
<body>
    <!-- Header Section -->
    <header>
        <img src="images/banner.jpg" alt="GamerPlayground Banner" class="banner" width="100%" height="300">
        <!-- Navigation Menu -->
        <nav>
            <a href="index.html">Home</a> &nbsp;&nbsp;|&nbsp;&nbsp;
            <a href="about.html">About Us</a> &nbsp;&nbsp;|&nbsp;&nbsp;
            <a href="products.html">Products</a> &nbsp;&nbsp;|&nbsp;&nbsp;
            <a href="contact.html">Contact Us</a> &nbsp;&nbsp;|&nbsp;&nbsp;
            <a href="community.html">Community and Trade-ins</a>
        </nav>
    </header>

<!-- Main Products Catalog Container -->
<section id="products-catalog">
    <div class="catalog-intro">
        <h2>Available Physical Hard Discs</h2>
        <p>All items listed are 100% verified genuine physical discs. No digital download voucher codes.</p>
    </div>

    <!-- Dynamic Control Panel: Search & Filter Elements -->
    <div class="control-panel">
        <input type="text" id="catalog-search" placeholder="🔍 Search games by title or platform...">
        
        <select id="catalog-sort">
            <option value="default">Sort Options: Default</option>
            <option value="title-asc">Title: A to Z</option>
            <option value="title-desc">Title: Z to A</option>
            <option value="platform">Group by Platform</option>
        </select>
    </div>

    <!-- JavaScript Data Engine Targets This Container Empty -->
    <div id="dynamic-product-grid" class="product-grid"></div>
</section>


    <!-- Footer -->
    <footer>
        <p>&copy; 2026 GamerPlayground | All Rights Reserved</p>
        <p>Follow us on 
            <a href="#">Facebook</a> | 
            <a href="#">Instagram</a> | 
            <a href="#">Twitter</a>
        </p>
    </footer>
</body>
</html>
